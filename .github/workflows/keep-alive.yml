name: Render Keep-Alive 24/7

on:
  schedule:
    # Runs every 12 minutes (cron: '*/12 * * * *')
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging Render deployment to keep it awake..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code} (%{time_total}s)" https://outreach-dashboard-22t5.onrender.com/api)
          echo "Response: $RESPONSE"
